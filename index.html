/* Keep horizontal scrolling synchronized, but show only the header scrollbar. */
#body-scroll{scrollbar-width:none;overflow-y:hidden}
#body-scroll::-webkit-scrollbar{display:none}

/* Result count shares the first column heading, outside its sort button. */
th.title-heading{white-space:nowrap}
th.title-heading>button{display:block;float:left;width:auto}
#count{display:block;overflow:hidden;margin-left:0;padding-left:8px;text-align:right;font-size:smaller;color:#a3b3cb;font-weight:400;line-height:25px}
.toolbar{margin-bottom:12px}

/* Single-line masthead, with workbook information aligned to the right. */
header{flex-wrap:nowrap;align-items:baseline;justify-content:flex-start;gap:16px}
header .eyebrow{flex:none;white-space:nowrap}
header h1{margin:0;font-size:22px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:clip}
header #source{flex:1;min-width:0;margin:0 0 0 auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:clip}
@media(max-width:700px){header{gap:8px}header h1{font-size:16px}header #source{font-size:11px}}

/* Compact controls above the table; table filters keep their own sizing. */
.toolbar{gap:8px;margin-bottom:8px}
.toolbar label{gap:4px;font-size:11px}
.toolbar button,.toolbar select,.toolbar input{font-size:12px;line-height:16px;min-height:28px;height:28px;padding:4px 8px}

/* Freeze the title heading, filter and cells inside their horizontal scrollers. */
#head tr>th:is(:first-child,.frozen-title){position:sticky;left:0;z-index:3;background:var(--layout-color-heading,#192c47);box-shadow:1px 0 0 var(--layout-color-border,#2e425f)}
#body tr>td:is(:first-child,.frozen-title):not([colspan]){position:sticky;left:0;z-index:1;background:var(--layout-color-table,#101b2d);box-shadow:1px 0 0 var(--layout-color-border,#2e425f)}
#body tr:nth-child(even)>td:is(:first-child,.frozen-title):not([colspan]){background:var(--layout-color-alternate-row,#142136)}
/* Grade styling uses the configured lighter background throughout pages 1/2. */
body[data-grade-titles="true"]:not([data-page="pending"]):not([data-page="sublist"]) :is(#body-scroll,#body tr,#body tr>td:is(:first-child,.frozen-title):not([colspan])){background:var(--layout-color-alternate-row,#142136)}

/* Column drag targets keep the existing heading click-to-sort action. */
#head tr:first-child>th{position:relative}
#head tr:first-child>th:is(:first-child,.frozen-title){position:sticky}
.column-resizer{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;touch-action:none;z-index:4}
#head tr:first-child>th{user-select:none}
#editHtml{margin-left:24px}
/* Separate layout actions from preceding controls, matching the edit-action gap. */
#clear,#pending-controls>button:nth-of-type(2),#sublist-more-columns{margin-right:24px}

/* Header scale slider sits immediately before the right-aligned source text. */
header .page-scale-control{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none;white-space:nowrap;font-size:12px}
header #page-scale{width:110px;min-height:0;height:16px;padding:0;border:0;background:transparent;accent-color:var(--layout-color-title,#8bc1ff);cursor:pointer}
header #page-scale-value{min-width:4ch;text-align:right}
/* Reserve the same source-text space on both pages so the switch does not shift. */
header #source{flex:0 1 auto;width:auto;margin-left:0}
@media(max-width:700px){header #page-scale{width:70px}}

header .scale-number{display:flex;align-items:center;gap:1px}
header #page-scale{touch-action:none}
header #page-scale-value{width:4ch;min-width:4ch;min-height:0;height:20px;padding:0;border:0;border-radius:0;background:transparent;color:inherit;font-size:12px;appearance:textfield;-moz-appearance:textfield}
#page-scale-value::-webkit-inner-spin-button,#page-scale-value::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* Persistent mode/permission indicators, independent of hover. */
#editHtml[aria-pressed="true"],#gradeTitles[aria-pressed="true"],#rowNumbers[aria-pressed="true"]{background:#23476c;border-color:#517caa}

body[data-edit-mode="true"] .filter-row,body[data-edit-mode="true"] .toolbar label,body[data-edit-mode="true"] #original,body[data-edit-mode="true"] #clearOrder,body[data-edit-mode="true"] #clear,body[data-edit-mode="true"] #resetLayout{display:none}
body[data-edit-mode="true"] #editHtml{margin-left:auto}
body[data-edit-mode="true"] th button,body[data-edit-mode="true"] .column-resizer{pointer-events:none;cursor:default}
.editable-cell{cursor:text;user-select:none}
.editable-cell .cell{white-space:nowrap;pointer-events:none}
#cellEditor{position:fixed;inset:0;margin:auto;width:min(1000px,90vw);max-height:85vh}
#cellEditor h2{font-size:18px;margin:0 0 12px}
#editFieldText{display:block;width:100%;height:50vh;min-height:160px;resize:vertical;background:var(--layout-color-input,#142238);color:var(--layout-color-text,#e5edf8);border:1px solid #517caa;border-radius:6px;padding:12px;font:inherit;line-height:1.6;white-space:pre-wrap}
.editor-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}

/* Edit row controls: boundary hit areas do not increase record row height. */
.row-insertion{height:0}
.row-insertion>td{height:0;min-width:0;padding:0;border:0;position:relative;overflow:visible}
.insert-row{position:absolute;left:0;right:0;top:-3px;width:100%;height:6px;min-height:0;padding:0;border:0;border-radius:0;background:transparent;z-index:1;cursor:copy}
.insert-row:hover,.insert-row:focus-visible,.insert-row[data-drop="true"]{background:#579bdf;box-shadow:0 0 3px #579bdf;outline:0}
/* Keep both edge hit areas inside the horizontal scroller, at the full 6px thickness. */
.row-insertion:first-child .insert-row{top:0}
.row-insertion:last-child .insert-row{top:-6px}
.row-insertion:only-child,.row-insertion:only-child>td{height:6px}
.row-insertion:only-child .insert-row{top:0}
body[data-edit-mode="true"] .editable-cell:has(>.row-handle)>.cell{display:inline-block;vertical-align:middle;width:calc(100% - 24px)}
.row-handle{display:inline-block;vertical-align:middle;width:18px;height:18px;min-height:0;margin-right:6px;padding:0;border:0;border-radius:0;background:repeating-linear-gradient(to bottom,#8aa5c5 0 2px,transparent 2px 5px) center/12px 12px no-repeat;cursor:grab}
.row-handle:active{cursor:grabbing}
.row-menu{position:fixed;z-index:20;background:var(--layout-color-heading,#192c47);border:1px solid #517caa;border-radius:6px;padding:5px;box-shadow:0 4px 14px #0008}
.row-menu button{white-space:nowrap}

#body-scroll{position:relative;z-index:0}
.insert-row{z-index:2}
body[data-edit-mode="true"] #body tr.edit-row,body[data-edit-mode="true"] #body tr.edit-row>td:is(:first-child,.frozen-title){background:var(--layout-color-table,#101b2d)}
body[data-edit-mode="true"] #body tr.edit-row.stripe,body[data-edit-mode="true"] #body tr.edit-row.stripe>td:is(:first-child,.frozen-title){background:var(--layout-color-alternate-row,#142136)}

/* Worksheet three: four independent tables with one synchronized horizontal view. */
#switchPage{flex:none;width:12em;font-size:12px;padding:4px 8px;white-space:nowrap;min-height:28px;height:28px}
[hidden]{display:none!important}
body[data-page="pending"] main>.toolbar>label,body[data-page="pending"] main>.toolbar>#original,body[data-page="pending"] main>.toolbar>#clearOrder,body[data-page="pending"] main>.toolbar>#clear{display:none}
body[data-page="pending"] main>.toolbar{justify-content:flex-end;flex-wrap:nowrap;overflow-x:auto}
body[data-page="pending"] main>.toolbar>button{flex:none;white-space:nowrap}
#pending-controls{display:flex;align-items:end;gap:8px;flex:1;min-width:max-content;order:-1}
#pending-controls .global{min-width:140px}
#pending-controls>button{flex:none;white-space:nowrap}
.pending-grid{display:flex;gap:18px;overflow-x:auto;overflow-y:hidden;align-items:flex-start}
.pending-grid>table{flex:none;table-layout:fixed}
.pending-heads{position:sticky;top:0;z-index:2;background:var(--layout-color-heading,#192c47);scrollbar-color:#415b7d var(--layout-color-table,#101b2d)}
.pending-bodies{scrollbar-width:none;background:var(--layout-color-table,#101b2d)}
.pending-bodies::-webkit-scrollbar{display:none}
.pending-heads th{position:relative;white-space:nowrap}
.pending-heads th>button{white-space:pre-line;line-height:normal}
.pending-heads th[data-two-line-heading="true"]>button{font-size:11px;line-height:12px;padding-top:0;padding-bottom:0}
.pending-heads th[data-title-heading="true"]>button{float:left;width:auto}
.pending-heads th[data-title-heading="true"] small{overflow:hidden;line-height:25px;padding-left:8px}
.pending-heads small{display:block;text-align:right;color:#a3b3cb;font-weight:400}
.pending-heads input{max-width:100%}
.pending-value{display:inline-block;max-width:100%;border:0;background:none;padding:0;font:inherit;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:clip;vertical-align:top}
.pending-bodies .editable-cell .cell{display:inline-block;max-width:100%;vertical-align:middle}
.pending-bodies .row-handle+.cell{max-width:calc(100% - 24px)}
.pending-bodies td{position:static}
.pending-bodies .row-insertion>td{position:relative}
.pending-bodies tr[data-drop="true"]{box-shadow:inset 0 3px #579bdf}

.pending-heads th[data-compact="true"]>button{font-size:12px}

/* Keep toolbar controls above the sticky headings on both pages. */
#page-header{position:sticky;top:0;z-index:6;padding:6px 16px 5px;align-items:center}
#page-header h1{font-size:20px}
main{padding:0 4px 4px}
main>.toolbar{position:sticky;top:var(--page-header-height,0px);z-index:5;background:#0b1220;padding-top:6px;padding-bottom:8px;margin-bottom:0}
.table-header,.pending-heads{top:calc(var(--page-header-height,0px) + var(--toolbar-height,0px))}
@media(max-width:700px){#page-header{padding:5px 8px}#page-header h1{font-size:16px}}

/* Fourth worksheet: spreadsheet grid with fixed full-content editor. */
body[data-page="sublist"] main>.toolbar>label,body[data-page="sublist"] #original,body[data-page="sublist"] #clearOrder,body[data-page="sublist"] #clear,body[data-page="sublist"] #resetLayout,body[data-page="sublist"] #editHtml{display:none}
#sublist-controls{display:flex;gap:8px;flex:1}
body[data-page="sublist"] #saveHtml{margin-left:24px}
body[data-page="sublist"] main>.toolbar{min-height:61px}
.sublist-editbar{display:flex;align-items:center;gap:12px;padding:8px;background:var(--layout-color-heading,#192c47);border:1px solid var(--layout-color-border,#2e425f);border-radius:8px 8px 0 0;height:44px}
#sublist-address{width:55px;text-align:center;font-size:13px;flex:none}
#sublist-value{flex:1;min-width:0;height:28px;resize:none;background:var(--layout-color-input,#142238);color:var(--layout-color-text,#e5edf8);border:1px solid var(--layout-color-input-border,#344963);border-radius:5px;padding:5px 8px;font:inherit;white-space:pre-wrap}
#sublist-scroll{height:calc(100vh / var(--page-scale) - var(--page-header-height,60px) - var(--toolbar-height,59px) - 48px);overflow:auto;border:1px solid var(--layout-color-border,#2e425f);background:var(--layout-color-table,#101b2d);scrollbar-color:#415b7d var(--layout-color-table,#101b2d)}
#sublist-table{min-width:100%;width:max-content}
#sublist-table th,#sublist-table td{min-width:var(--sublist-cell-width,180px);width:var(--sublist-cell-width,180px);max-width:var(--sublist-cell-width,180px);height:28px;padding:0;border-right:1px solid var(--layout-color-cell-border,#253651)}
#sublist-table th:first-child{min-width:48px;width:48px;max-width:48px;text-align:center;font-size:12px}
#sublist-table thead th{position:sticky;top:0;z-index:2;text-align:center;font-size:12px}
#sublist-table td input{display:block;min-height:27px;height:27px;width:100%;border:0;border-radius:0;background:transparent;padding:2px 6px;font:inherit;outline:none;cursor:text}
#sublist-table td[data-selected="true"]{box-shadow:inset 0 0 0 2px #65aaff}
.sublist-resizer{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;touch-action:none;user-select:none}
#sublist-table input:read-only,#sublist-value:read-only{caret-color:transparent}
.conflict-actions{display:flex;gap:8px;margin-top:10px}
.conflict-actions button{font-size:13px;padding:6px 10px}

/* All record-style pages share typography and stable heading/filter geometry. */
#primary-page table{font-family:var(--table-font);font-size:14px}
#head tr:first-child{height:44px}
#head .filter-row,.pending-heads thead tr:nth-child(2){height:39px}
#head .filter-row th,.pending-heads thead tr:nth-child(2) th{padding-top:2px;padding-bottom:2px;vertical-align:middle}
#head .filter-row th>input,.pending-heads thead tr:nth-child(2) th>input{display:block}
#body td:not([colspan]){line-height:19px}
/* Keep the same horizontal scrollbar strip when every column fits. */
#head-scroll,.pending-heads{overflow-x:scroll}

/* Use the workbook's body font for table content without changing UI sizes. */
:root{--table-font:"FangSong","仿宋","Yu Mincho","MS Mincho",serif}
#pending-page table,#sublist-table,#sublist-value,#editFieldText{font-family:var(--table-font)}


/* Compact FangSong tables: centered controls and slightly tighter data rows. */
#head tr:first-child,.pending-heads thead tr:first-child{height:32px}
#head tr:first-child th,.pending-heads thead tr:first-child th{padding-top:3px;padding-bottom:3px;vertical-align:middle}
#head tr:first-child th>button,.pending-heads th>button{line-height:18px;padding-top:1px;padding-bottom:1px}
#count,.pending-heads small{line-height:20px}
#head .filter-row,.pending-heads thead tr:nth-child(2){height:31px}
#head th input,.pending-heads th input{height:21px;min-height:21px;padding-top:1px;padding-bottom:1px;line-height:17px}
#body td:not([colspan]),.pending-bodies td:not([colspan]){padding-top:4px;padding-bottom:4px;line-height:19px;vertical-align:middle}
.pending-heads th[data-two-line-heading="true"]>button{font-size:10px;line-height:11px;padding:0}
#sublist-table th,#sublist-table td{height:28px;vertical-align:middle}
#sublist-table thead th{height:32px}
#sublist-table td input{height:27px;min-height:27px;line-height:19px;padding-top:4px;padding-bottom:4px}
.sublist-editbar{height:32px;padding:3px 8px}
#sublist-value{height:24px;padding-top:2px;padding-bottom:2px;line-height:18px}
#sublist-scroll{height:calc(100vh / var(--page-scale) - var(--page-header-height,60px) - var(--toolbar-height,59px) - 36px)}

/* Keep the Save label on one line. */
#saveHtml{flex-shrink:0;white-space:nowrap;font-variant-numeric:tabular-nums}

body:not([data-desktop="true"]) #resetLayout{margin-left:auto}
body:not([data-desktop="true"]) #sublist-reset-layout{margin-left:auto}

.header-editor{font:inherit;color:inherit;min-width:0;width:100%;box-sizing:border-box;padding:0 3px;height:22px}
.field dd{min-height:1.85em}
.detail-edit-value{display:block;min-height:1.85em;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;line-height:inherit;cursor:text}
.field dd>.cell-input{width:100%;font:inherit}
.field dd>.detail-multiline{display:block;min-height:1.85em;line-height:inherit;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;background:transparent;color:inherit}

body[data-edit-mode="true"] #head tr:first-child th>button,body[data-edit-mode="true"] .pending-heads tr:first-child th>button{pointer-events:auto;cursor:text}
body[data-page="uncounted"][data-edit-mode="true"] #head tr:first-child th>button{pointer-events:none;cursor:default}
/* Build-time appearance settings; tag size never expands table rows. */
:root{font-size:var(--layout-ui-font-size,14px)}
#primary-page table,#pending-page table{font-size:var(--layout-table-font-size,14px)}
#body td:not([colspan]),.pending-bodies td:not([colspan]){height:var(--layout-row-height,28px);padding-top:var(--layout-row-padding,4px);padding-bottom:var(--layout-row-padding,4px);line-height:max(var(--layout-row-line-height,19px),1.2em);vertical-align:middle}
#body td:not([colspan]) .cell,.pending-bodies td:not([colspan]) .cell{line-height:inherit}
#head tr:first-child,.pending-heads thead tr:first-child{height:var(--layout-header-height,32px)}
#head tr:first-child th>button,.pending-heads th>button{font-size:var(--layout-header-font-size,14px);line-height:1.3}
#head tr:first-child th[data-compact="true"]>button,.pending-heads th[data-range-heading="true"]>button{font-size:var(--layout-compact-header-font-size,12px)}
.pending-heads th[data-two-line-heading="true"]>button{font-size:var(--layout-two-line-header-font-size,10px);line-height:1.1}
#head .filter-row,.pending-heads thead tr:nth-child(2){height:var(--layout-filter-row-height,31px)}
#head th input,.pending-heads th input{font-size:var(--layout-filter-font-size,12px);height:var(--layout-filter-input-height,21px);min-height:calc(1.2em + 4px);line-height:1.2}
#head .duration-range input,.pending-heads .duration-range input{font-size:var(--layout-range-font-size,11px)}
#sublist-table,#sublist-value{font-size:var(--layout-sublist-font-size,14px)}
#sublist-table th,#sublist-table td{height:var(--layout-sublist-row-height,28px);vertical-align:middle}
#sublist-table thead th{height:var(--layout-header-height,32px);font-size:var(--layout-sublist-header-font-size,12px)}
#sublist-table td input{height:calc(var(--layout-sublist-row-height,28px) - 1px);min-height:calc(1.2em + 8px);line-height:1.2}
#resetLayout,#sublist-reset-layout{margin-left:auto}

#sublist-table th:first-child{min-width:var(--sublist-row-header-width,48px);width:var(--sublist-row-header-width,48px);max-width:var(--sublist-row-header-width,48px);font-size:var(--layout-sublist-header-font-size,12px)}

/* Table theme and spacing are compiled from the same appearance policy. */
.table-wrap{border-radius:var(--layout-corner-radius,8px)}
#head th,.pending-heads th{padding-left:var(--layout-header-padding-x,8px);padding-right:var(--layout-header-padding-x,8px)}
#body td:not([colspan]),.pending-bodies td:not([colspan]){padding-left:var(--layout-row-padding-x,10px);padding-right:var(--layout-row-padding-x,10px)}
#head th[data-compact="true"],#body td[data-compact="true"]{padding-left:var(--layout-compact-padding-x,6px);padding-right:var(--layout-compact-padding-x,6px)}
#head th,#body td,.pending-heads th,.pending-bodies td,#sublist-table th,#sublist-table td{border-bottom-width:var(--layout-border-width,1px)}
.pending-grid{gap:var(--layout-pending-gap,18px)}

/* Waitlist flags affect text only; rows remain fully interactive. */
.pending-bodies tr[data-muted="true"],.pending-bodies tr[data-muted="true"] button,.pending-bodies tr[data-muted="true"] input{color:var(--layout-color-muted-row,#929292)}




/* Detail headers move their dialog without affecting field editing. */
:is(#details,#pending-details){width:min(var(--detail-panel-width,1000px),94vw);max-width:calc(100vw / var(--page-scale) - 16px);max-height:min(88vh,calc(100vh / var(--page-scale) - 16px))}
:is(#details,#pending-details) .dialog-top{cursor:grab;user-select:none;touch-action:none}
:is(#details,#pending-details) .dialog-top[data-dragging]{cursor:grabbing}
#page-header :is(h1,.eyebrow,#source,.scale-number),:is(#details,#pending-details) .dialog-top h2{user-select:text;cursor:text}

/* Row numbers are presentation cells; hidden mode restores the original columns. */
body[data-row-numbers="true"] #head tr>.frozen-title,body[data-row-numbers="true"] #body tr>.frozen-title{left:var(--row-number-width,28px)}
#head .row-number,#body td.row-number:not([colspan]),.pending-heads th.row-number,.pending-bodies td.row-number:not([colspan]){text-align:center;vertical-align:middle;color:var(--layout-color-muted,#a3b3cb);font-variant-numeric:tabular-nums;padding-left:2px;padding-right:2px;white-space:nowrap;overflow:hidden;border-right:var(--row-number-separator-width,1px) solid var(--row-number-separator-color,#344963);box-shadow:none}
body[data-page="sublist"] #rowNumbers{display:none}

/* Join the blank number heading and filter cells visually in viewing mode. */
body:not([data-edit-mode="true"]) #head tr:first-child>th.row-number,body:not([data-edit-mode="true"]) .pending-heads tr:first-child>th.row-number{border-bottom-width:0}

/* Shared detail groups wrap proportionally, with labels above values. */
.record-detail-layout .detail-row{display:flex;flex-wrap:wrap;row-gap:18px;column-gap:0;margin:0;padding:var(--detail-grouped-row-padding,8px) 0;border-top:1px solid var(--layout-color-border,#2e425f)}
.record-detail-layout .detail-row>.field{display:flex;flex-direction:column;align-items:stretch;gap:var(--detail-label-value-gap,2px);min-width:0;max-width:100%;padding:0 var(--detail-grouped-item-padding,6px) 0 0;border:0}
.record-detail-layout .detail-row dt{font-size:var(--detail-label-size,10px);color:var(--detail-label-color,#b6d8ff);line-height:1.5;overflow-wrap:anywhere}
.record-detail-layout .detail-row dd{font-size:var(--detail-value-size,16px);color:var(--detail-value-color,#e5edf8);line-height:1.6;min-width:0}
.record-detail-layout .detail-row dd>button,.record-detail-layout .detail-row dd>textarea{font-size:inherit;color:inherit}
.record-detail-layout.detail-fit .detail-row{flex-wrap:nowrap}
.record-detail-layout.detail-fit .detail-row dd{margin-top:auto;min-height:calc(var(--detail-value-size,16px)*1.85);line-height:calc(var(--detail-value-size,16px)*1.6)}
.record-detail-layout.detail-fit .detail-row dd,.record-detail-layout.detail-fit .detail-row dd :is(button,span,textarea){white-space:pre;overflow-wrap:normal}
.record-detail-layout.detail-fit .detail-row .detail-edit-value{min-height:0}
.record-detail-layout>dl:last-child{margin:0}

.record-detail-layout>dl:last-child>.field{padding-top:var(--detail-full-width-row-padding,14px);padding-bottom:var(--detail-full-width-row-padding,14px)}

/* Keep gutters inside ratio allocations so equal cumulative weights align. */
.record-detail-layout .detail-row>.field:last-child{padding-right:0}

/* Editors occupy the existing value box; outlines borrow surrounding padding. */
#details .field dt,#pending-details .field dt{color:var(--detail-label-color)}
.editor-host{position:relative}
.field dd>.stable-editor,.editor-host>.stable-editor{position:absolute;inset:0;width:100%;height:100%;min-height:0;max-height:none;margin:0;padding:0;border:0;border-radius:0;box-sizing:border-box;background:transparent;resize:none;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;outline:1px solid #65aaff;outline-offset:2px}
.editor-host>.stable-editor:focus{outline:1px solid #65aaff;outline-offset:2px}

.editor-host>.stable-editor{pointer-events:auto}

/* Full-width labels use their text width rather than a fixed 150px column. */
#details .field:not(.detail-row>.field){grid-template-columns:fit-content(25%) minmax(0,1fr);gap:var(--detail-full-width-label-gap,6px)}
@media(max-width:700px){#details .field:not(.detail-row>.field){grid-template-columns:1fr}}
.pending-value.pending-title{color:var(--layout-color-title,#8bc1ff)}

/* Editing uses plain titles and reserves one line for handle plus title. */
body[data-edit-mode="true"] :is(#rowNumbers,#gradeTitles){display:none}
body[data-edit-mode="true"] #body td.editable-cell:has(>.row-handle){white-space:nowrap}
body[data-edit-mode="true"] #body td.editable-cell:has(>.row-handle)>.cell{width:calc(100% - 24px);display:inline-block;vertical-align:middle}

/* Override the older table-input metrics: text occupies the original line box. */
.editable-cell .editor-host>.stable-editor{height:100%;min-height:0;padding:0;border:0;white-space:pre;overflow:hidden}

/* Empty cells still need a full-size hit area for the overlay editor. */
.editable-cell>.editor-host.cell{width:100%;min-height:1lh}

/* Normal generation labels fit a compact fixed-size button. */
#details,#pending-details{border-radius:0}
:is(#details,#pending-details) [data-detail-image]{flex:0 0 auto;width:calc(6em + 20px);height:calc(1.5em + 14px);line-height:1.5;white-space:nowrap;padding:6px 9px}
:is(#details,#pending-details) .dialog-top>h2{min-width:0;overflow-wrap:anywhere}
.detail-image-preview{position:fixed;inset:auto;left:50vw;top:50vh;transform:translate(-50%,-50%);margin:0;zoom:calc(1 / var(--page-scale));width:fit-content;max-width:94vw;max-height:none;padding:0;border:0;border-radius:0;outline:none;background:transparent;overflow:visible}
.detail-image-error{padding:12px;background:#38202a;color:#ffc3bc;white-space:pre-wrap;overflow-wrap:anywhere}
.detail-image-preview img{display:block;width:auto;height:auto;max-width:94vw;max-height:94vh;user-select:auto}

/* Record-table captures use normal cells in an isolated viewport. */
body[data-page]:not([data-page="primary"]):not([data-page="uncounted"]):not([data-page="media"]) #tableImageButton{display:none}
#tableImageButton{white-space:nowrap;flex-shrink:0;margin-left:16px}
#tableImageOptions{width:min(440px,94vw)}
#tableImageOptions label{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
#tableImageOptions .dialog-top{position:static;padding-top:0}
#tableImageOptions h2{font-size:20px}
#tableImageOptions p{font-size:13px;line-height:1.6}
.table-image-snapshot{background:var(--layout-color-table,#101b2d);color:var(--layout-color-text,#e5edf8);overflow:hidden}
.table-image-snapshot .table-image-search{margin:0;padding:8px;background:#0b1220}
.table-image-snapshot .global{flex:none;width:min(420px,100%);min-width:0}
.table-image-snapshot #primary-page{border-radius:0;overflow:hidden}
.table-image-snapshot :is(#head th,#body td){position:static!important;box-shadow:none!important}
.table-image-snapshot #head .duration-bound input{padding-right:2px}
.table-image-snapshot #head input{outline:none;max-width:100%}
.table-image-snapshot #head .tag-search{overflow:hidden}
.table-image-snapshot #head .tag-search input{flex:none}
.table-image-snapshot #head .tag-search .selected-tag{padding-right:var(--layout-chip-padding-x,4px)}
.table-image-snapshot #body .cell,.table-image-snapshot #body .record{width:max-content!important;max-width:none!important;white-space:nowrap}
.table-image-snapshot #body td[data-image-clipped] .cell{width:100%!important;max-width:100%!important}
/* Published HTML reveals no viewer until authentication succeeds. */
body[data-locked="true"] > :not(#unlockView):not(script) { display:none !important; }
#unlockView { min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box; }
#unlockForm { width:min(100%,340px);display:flex;flex-direction:column;gap:16px; }
#unlockTitle { font-size:22px;line-height:1.5; }
#unlockPassword { width:100%;box-sizing:border-box;font-size:20px;padding:12px; }
#unlockButton { min-height:44px; }
#unlockMessage { min-height:3em;line-height:1.5; }
</style>

/* Index-based program policy, embedded by both native builders. */

  const table=group=>group==='pending'?config.pending:config.records[group==='media'?'media':'primary'];

        resolving.delete(key);return resolved[key]=Object.freeze(c);
      };
      const built={};
      for(const name of ['primary','media','pending']){
        const columns=Object.freeze(table(name).columns.map(c=>resolve(name,c.index)).sort((a,b)=>a.index-b.index));
        built[name]={columns,roles:new Map([...columns].reverse().map(c=>[c.role,c.index])),
          types:Object.freeze(columns.map(c=>c.type==='number'?true:['text','tags'].includes(c.type)?false:c.type)),
          tags:Object.freeze(columns.filter(c=>c.type==='tags').map(c=>c.index))};
      }
      policies=built;
    }
    return policies[group==='pending'?'pending':group==='media'?'media':'primary'];
  }
  const columns=group=>policy(group).columns;
  const column=(group,index)=>columns(group)[index];
  const role=(group,name)=>policy(group).roles.get(name)??-1;
  const types=group=>policy(group).types;

// Native page scrolling moves the rows; keep the two horizontal views aligned.
function syncHorizontalScroll(source, target) {
  if (target.scrollLeft !== source.scrollLeft) target.scrollLeft = source.scrollLeft;
}
// Redirect the wheel only over the horizontal scrollbar strip, not headings/filters.
document.addEventListener('wheel', event => {
  if (event.ctrlKey || event.metaKey) return;
  const bar = $('head-scroll');
  if (bar.scrollWidth <= bar.clientWidth || !bar.offsetHeight) return;
  const rect = bar.getBoundingClientRect(), scale = rect.height / bar.offsetHeight;
  const strip = Math.max(bar.offsetHeight - bar.clientHeight, 12) * scale;
  if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.bottom - strip || event.clientY > rect.bottom) return;
  const delta = event.deltaY || event.deltaX;
  if (!delta) return;
  event.preventDefault(); event.stopPropagation();
  const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? bar.clientWidth : 1 / scale;
  bar.scrollLeft = Math.max(0, Math.min(bar.scrollWidth - bar.clientWidth, bar.scrollLeft + delta * unit));
  syncHorizontalScroll(bar, $('body-scroll'));
}, {passive:false,capture:true});
$('head-scroll').addEventListener('scroll', () => syncHorizontalScroll($('head-scroll'), $('body-scroll')), {passive:true});
$('body-scroll').addEventListener('scroll', () => syncHorizontalScroll($('body-scroll'), $('head-scroll')), {passive:true});

// Measure CSS layout pixels (not zoomed screen pixels), including wrapped rows.
function observeToolbarHeight() {
  const toolbar=document.querySelector?.('main > .toolbar');
  if(!toolbar || typeof ResizeObserver==='undefined')return;
  const header=$('page-header');
  const observer=new ResizeObserver(entries=>{
    for(const entry of entries){
      const height=entry.borderBoxSize?.[0]?.blockSize ?? entry.target.offsetHeight;
      const property=entry.target===header?'--page-header-height':'--toolbar-height';
      document.documentElement.style.setProperty(property,height+'px');
    }
  });
  observer.observe(toolbar);observer.observe(header);
}
observeToolbarHeight();

/* The password and derived keys exist only for this unlock attempt. */
(() => {
  const form=document.getElementById('unlockForm'),input=document.getElementById('unlockPassword');
  const button=document.getElementById('unlockButton'),message=document.getElementById('unlockMessage');
  const payload=document.getElementById('library-data');
  const envelope=JSON.parse(payload.textContent);
  const encoder=new TextEncoder();
  const decode=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
  const join=(...parts)=>{const result=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));let offset=0;for(const part of parts){result.set(part,offset);offset+=part.length;}return result;};
  let busy=false;
  async function unlock(password,fromUrl=false){
    if(busy)return;
    busy=true;button.disabled=input.disabled=true;message.textContent='';
    let plaintext;
    try {
      if(!globalThis.crypto?.subtle)throw new Error('UNSUPPORTED');
      if(envelope.version!==1||envelope.algorithm!=='AES-256-CBC-HMAC-SHA256'||envelope.iterations!==600000)throw new Error('FORMAT');
      const salt=decode(envelope.salt),iv=decode(envelope.iv),ciphertext=decode(envelope.ciphertext),tag=decode(envelope.tag);
      if(salt.length!==16||iv.length!==16||tag.length!==32)throw new Error('FORMAT');
      const material=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveBits']);
      const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:envelope.iterations},material,512));
      try {
        const auth=await crypto.subtle.importKey('raw',bits.subarray(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
        const authenticated=join(encoder.encode('RSDB-HTML-v1\n'),salt,iv,ciphertext);
        if(!await crypto.subtle.verify('HMAC',auth,tag,authenticated))throw new Error('PASSWORD');
        const key=await crypto.subtle.importKey('raw',bits.subarray(0,32),'AES-CBC',false,['decrypt']);
        plaintext=new TextDecoder('utf-8',{fatal:true}).decode(await crypto.subtle.decrypt({name:'AES-CBC',iv},key,ciphertext));
        ProgramLayout.validate(JSON.parse(plaintext));
      } finally {bits.fill(0);}
    } catch(error) {
      message.textContent=error.message==='UNSUPPORTED'?'HTTPS または対応ブラウザーでローカルファイルを開いてください。':fromUrl?'':'パスワードが違うか、ファイルが破損しています。';
      busy=false;button.disabled=input.disabled=false;input.value='';input.focus();return;
    }
    input.value='';payload.textContent=plaintext;
    document.getElementById('unlockView').remove();document.body.removeAttribute('data-locked');
    startViewer();
  }
  form.addEventListener('submit',event=>{event.preventDefault();unlock(input.value);});
  // Query support is explicit. Fragments additionally avoid sending the password to a host.
  const url=new URL(location.href),fragment=new URLSearchParams(url.hash.slice(1));
  const password=url.searchParams.get('password')??fragment.get('password');
  if(password!==null){
    url.searchParams.delete('password');
    if(fragment.has('password')){fragment.delete('password');url.hash=fragment.toString();}
    try{history.replaceState(null,'',url.href);}catch{/* Some file URL browsers disallow history changes. */}
    unlock(password,true);
  }else input.focus();
})();
